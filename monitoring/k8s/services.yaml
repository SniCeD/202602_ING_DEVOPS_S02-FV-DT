apiVersion: v1
kind: Service
metadata:
  name: cuentas-metrics
spec:
  clusterIP: None
  selector:
    app: cuentas-svc
  ports:
    - name: metrics
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
spec:
  selector:
    app: pushgateway
  ports:
    - port: 9091
