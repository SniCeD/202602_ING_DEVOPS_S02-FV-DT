apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - services.yaml
  - workloads.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-datasource
    files:
      - datasource.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml
  - name: grafana-dashboard
    files:
      - cuentas.json
