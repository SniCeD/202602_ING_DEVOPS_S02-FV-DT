global:
  scrape_interval: 15s
scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
  - job_name: cuentas-svc
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [cuentas-metrics]
        type: A
        port: 8080
        refresh_interval: 15s
