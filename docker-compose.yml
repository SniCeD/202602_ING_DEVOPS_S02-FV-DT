services:
  cuentas-svc:
    build: .
    image: "duoc/jv0101-caso04-cuentas:${IMAGE_TAG:-1.0.0}"
    ports:
      - "8080"

    restart: unless-stopped

    # Limites de recursos del contenedor
    cpus: "1.0"
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 200

    # Orquestacion y escalabilidad
    deploy:
      replicas: 2

      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200
        reservations:
          cpus: "0.25"
          memory: 128M