apiVersion: apps/v1

kind: Deployment

metadata:
  name: cuentas-svc

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cuentas-svc

  template:
    metadata:
      labels:
        app: cuentas-svc

    spec:
      containers:
        - name: cuentas-svc

          image: ghcr.io/sniced/202602_ing_devops_s02-fv-dt:IMAGE_TAG

          env:
            - name: SPRING_APPLICATION_JSON
              value: '{"management":{"endpoint":{"health":{"probes":{"enabled":true}}},"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'
            - name: SPRING_H2_CONSOLE_ENABLED
              value: "false"
          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"

            limits:
              cpu: "1"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080

            initialDelaySeconds: 30

            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080

            initialDelaySeconds: 15
            periodSeconds: 5
