
name: CI - Cuentas Service

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas, cobertura y SonarQube Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar pruebas y cobertura
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Analizar con SonarQube Cloud y evaluar Quality Gate
        if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode --no-transfer-progress
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=SniCeD_202602_ING_DEVOPS_S02-FV-DT
          -Dsonar.organization=sniced
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  security-dependencies:
    name: Snyk - análisis de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Snyk - análisis de dependencias
        run: npx --yes snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  security-code:
    name: Snyk - análisis de código
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Snyk - análisis estático de código
        run: npx --yes snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  security-secrets:
    name: Auditoría de secretos (Gitleaks)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Descargar historial completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detectar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml
  docker-build:
    name: Construcción de imagen Docker
    runs-on: ubuntu-latest

    permissions:
      contents: read

    needs:
      - tests
      - security-dependencies
      - security-code
      - security-secrets

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7


      - name: Construir imagen Docker
        run: docker build --pull --tag "duoc/jv0101-caso04-cuentas:${GITHUB_SHA}" .

      - name: Verificar imagen construida
        run: docker image inspect "duoc/jv0101-caso04-cuentas:${GITHUB_SHA}" > /dev/null


      - name: Exportar imagen Docker
        run: docker save "duoc/jv0101-caso04-cuentas:${GITHUB_SHA}" -o cuentas-svc.tar

      - name: Guardar imagen como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: imagen-cuentas-${{ github.sha }}
          path: cuentas-svc.tar

  security-image:
    name: Auditoría de imagen Docker (Trivy)
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Descargar imagen construida
        uses: actions/download-artifact@v7
        with:
          name: imagen-cuentas-${{ github.sha }}

      - name: Cargar imagen Docker
        run: docker load --input cuentas-svc.tar

      - name: Detectar vulnerabilidades críticas con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: duoc/jv0101-caso04-cuentas:${{ github.sha }}
          format: json
          output: trivy-image-report.json
          exit-code: "1"
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: "false"

      - name: Guardar reporte Trivy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report-${{ github.sha }}
          path: trivy-image-report.json
          if-no-files-found: ignore
          retention-days: 30

  publish-image:
    name: Publicar imagen validada en GHCR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    needs:
      - security-image

    permissions:
      contents: read
      packages: write

    env:
      GHCR_IMAGE: ghcr.io/sniced/202602_ing_devops_s02-fv-dt

    steps:
      - name: Descargar imagen validada
        uses: actions/download-artifact@v7
        with:
          name: imagen-cuentas-${{ github.sha }}

      - name: Cargar imagen Docker
        run: docker load --input cuentas-svc.tar

      - name: Iniciar sesión en GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Etiquetar imagen para GHCR
        run: |
          docker tag \
            "duoc/jv0101-caso04-cuentas:${GITHUB_SHA}" \
            "${GHCR_IMAGE}:${GITHUB_SHA}"

      - name: Publicar imagen validada en GHCR
        run: docker push "${GHCR_IMAGE}:${GITHUB_SHA}"

  deploy:
    name: Despliegue simulado con Docker Compose
    runs-on: ubuntu-latest

    needs:
      - tests
      - security-dependencies
      - security-code
      - security-secrets
      - docker-build
      - security-image

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Descargar imagen construida
        uses: actions/download-artifact@v7
        with:
          name: imagen-cuentas-${{ github.sha }}

      - name: Cargar imagen Docker
        run: docker load -i cuentas-svc.tar

      - name: Desplegar con Docker Compose
        run: docker compose up -d --no-build --wait --wait-timeout 120


      - name: Mostrar estado del despliegue
        run: docker compose ps

      - name: Verificar replicas saludables
        shell: bash
        run: |
          containers=$(docker compose ps -q cuentas-svc)

          count=$(echo "$containers" | wc -w)

          echo "Replicas detectadas: $count"

          test "$count" -eq 2

          for container in $containers; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$container")

            echo "$container -> $status"

            test "$status" = "healthy"
          done

      - name: Verificar endpoints
        shell: bash
        run: |
          for i in 1 2; do

            port=$(docker compose port --index=$i cuentas-svc 8080 | awk -F: '{print $NF}')

            echo "Replica $i -> localhost:$port"

            curl --fail --retry 5 --retry-delay 2 "http://localhost:${port}/"
          done

      - name: Evidencia de trazabilidad
        run: |
          echo "Commit desplegado: ${GITHUB_SHA}"

          # Verifica que la imagen usada corresponda al commit actual.
          docker image inspect "duoc/jv0101-caso04-cuentas:${GITHUB_SHA}" > /dev/null

          echo "Imagen desplegada: duoc/jv0101-caso04-cuentas:${GITHUB_SHA}"

      - name: Limpiar entorno
        if: always()
        run: docker compose down --remove-orphans

  deploy-kubernetes:
    name: Despliegue y observabilidad en EKS
    if: ${{ github.event_name == 'push' && vars.EKS_DEPLOY_BRANCH != '' && github.ref_name == vars.EKS_DEPLOY_BRANCH && vars.EKS_CLUSTER_NAME != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ep3-eks
    concurrency:
      group: ep3-eks
      cancel-in-progress: false
    needs:
      - tests
      - security-dependencies
      - security-code
      - security-secrets
      - docker-build
      - security-image
      - publish-image
    env:
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Recuperar reporte JaCoCo de esta ejecución
        uses: actions/download-artifact@v7
        with:
          name: reporte-cobertura-jacoco
          path: ${{ runner.temp }}/jacoco

      - name: Validar configuración regional
        shell: bash
        env:
          DEPLOY_REGION: ${{ secrets.AWS_REGION }}
          SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [[ "$DEPLOY_REGION" != us-east-1 || -z "$SESSION_TOKEN" ]]; then
            echo "::error::El entorno ep3-eks requiere AWS_REGION para us-east-1 y una sesión temporal."
            exit 1
          fi

      - name: Configurar credenciales temporales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
          force-skip-oidc: true
          mask-aws-account-id: true

      - name: Configurar kubectl para el clúster
        shell: bash
        run: |
          version=$(aws eks describe-cluster --region us-east-1 --name "$EKS_CLUSTER_NAME" --query cluster.version --output text)
          release=$(curl -fsS "https://dl.k8s.io/release/stable-${version}.txt")
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://dl.k8s.io/release/${release}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${release}/bin/linux/amd64/kubectl.sha256"
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          aws eks update-kubeconfig --region us-east-1 --name "$EKS_CLUSTER_NAME" --kubeconfig "$RUNNER_TEMP/ep3-kubeconfig" >/dev/null
          echo "KUBECONFIG=$RUNNER_TEMP/ep3-kubeconfig" >> "$GITHUB_ENV"

      - name: Desplegar, verificar y publicar métricas
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ep3-evidence"
          bash scripts/ep3/deploy-kubernetes.sh "$RUNNER_TEMP/jacoco/jacoco.xml" "$RUNNER_TEMP/ep3-evidence" 2>&1 \
            | tee "$RUNNER_TEMP/ep3-evidence/deploy-kubernetes.log"

      - name: Guardar evidencia del despliegue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ep3-eks-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ep3-evidence/
          if-no-files-found: ignore
