
name: CI - Cuentas Service

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar pruebas y cobertura
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  docker-build:
    name: Construcción de imagen Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build --pull --tag "cuentas-svc:${GITHUB_SHA}" .

      - name: Verificar imagen construida
        run: docker image inspect "cuentas-svc:${GITHUB_SHA}" > /dev/null
