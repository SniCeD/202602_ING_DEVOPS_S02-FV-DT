
name: CI - Cuentas Service

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar pruebas y cobertura
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  security-dependencies:
    name: Snyk - análisis de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Snyk - análisis de dependencias
        run: npx --yes snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  security-code:
    name: Snyk - análisis de código
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Snyk - análisis estático de código
        run: npx --yes snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  docker-build:
    name: Construcción de imagen Docker
    runs-on: ubuntu-latest
    needs:
      - tests
      - security-dependencies
      - security-code

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build --pull --tag "duoc/jv0101-caso04-cuentas:${GITHUB_SHA}" .

      - name: Verificar imagen construida
        run: docker image inspect "duoc/jv0101-caso04-cuentas:${GITHUB_SHA}" > /dev/null
      - name: Exportar imagen Docker
        run: docker save "duoc/jv0101-caso04-cuentas:${GITHUB_SHA}" -o cuentas-svc.tar

      - name: Guardar imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: imagen-cuentas-${{ github.sha }}
          path: cuentas-svc.tar

  deploy:
    name: Despliegue simulado con Docker Compose
    runs-on: ubuntu-latest

    needs:
      - tests
      - security-dependencies
      - security-code
      - docker-build

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar imagen construida
        uses: actions/download-artifact@v4
        with:
          name: imagen-cuentas-${{ github.sha }}

      - name: Cargar imagen Docker
        run: docker load -i cuentas-svc.tar

      - name: Desplegar con Docker Compose
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Mostrar estado del despliegue
        run: docker compose ps

      - name: Verificar replicas saludables
        shell: bash
        run: |
          containers=$(docker compose ps -q cuentas-svc)
          count=$(echo "$containers" | wc -w)

          echo "Replicas detectadas: $count"
          test "$count" -eq 2

          for container in $containers; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$container")
            echo "$container -> $status"
            test "$status" = "healthy"
          done

      - name: Verificar endpoints
        shell: bash
        run: |
          for i in 1 2; do
            port=$(docker compose port --index=$i cuentas-svc 8080 | awk -F: '{print $NF}')
            echo "Replica $i -> localhost:$port"
            curl --fail --retry 5 --retry-delay 2 "http://localhost:${port}/"
          done

      - name: Evidencia de trazabilidad
        run: |
          echo "Commit desplegado: ${GITHUB_SHA}"
          docker image inspect "duoc/jv0101-caso04-cuentas:${GITHUB_SHA}" > /dev/null
          echo "Imagen desplegada: duoc/jv0101-caso04-cuentas:${GITHUB_SHA}"

      - name: Limpiar entorno
        if: always()
        run: docker compose down --remove-orphans